name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Release jobs can write to the repository, so they do not restore a dependency cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require the tag to match package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm test
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pnpm zip
          zip=".output/copy-title-url-$version-chrome.zip"
          if [[ ! -f "$zip" ]]; then
            echo "error: release asset was not produced: $zip" >&2
            exit 1
          fi
          (cd .output && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256")
      - name: Upload GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="changelogs/$version.md"
          release_assets=(
            ".output/copy-title-url-$version-chrome.zip"
            ".output/copy-title-url-$version-chrome.zip.sha256"
          )
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "error: refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Copy Title and URL $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Copy Title and URL $version" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$is_prerelease"
