name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Release jobs can publish what they build, so they do not restore a dependency cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require the tag to match package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm test
      # zip:store renames the ZIP that wxt zip writes, so it must run before the release ZIP is built
      - run: pnpm zip:store
      - run: pnpm zip
      - name: Check the packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_zip=".output/copy-title-url-$version-chrome.zip"
          store_zip=".output/copy-title-url-$version-chrome-store.zip"
          for zip in "$release_zip" "$store_zip"; do
            if [[ ! -f "$zip" ]]; then
              echo "error: package was not produced: $zip" >&2
              exit 1
            fi
          done
          if ! unzip -p "$release_zip" manifest.json | jq -e 'has("key")' > /dev/null; then
            echo "error: $release_zip must contain manifest.key to keep the extension ID for unpacked installs" >&2
            exit 1
          fi
          if unzip -p "$store_zip" manifest.json | jq -e 'has("key")' > /dev/null; then
            echo "error: $store_zip must not contain manifest.key; the Chrome Web Store rejects it" >&2
            exit 1
          fi
          (cd .output && sha256sum "$(basename "$release_zip")" > "$(basename "$release_zip").sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            .output/*.zip
            .output/*.zip.sha256
          if-no-files-found: error

  # Both publish jobs wait on the release environment, so one approval starts them together
  github-release:
    needs: verify
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: .output
      - name: Upload GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="changelogs/$version.md"
          release_assets=(
            ".output/copy-title-url-$version-chrome.zip"
            ".output/copy-title-url-$version-chrome.zip.sha256"
          )
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "error: refusing to replace assets on published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          elif [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Tidy Title & URL $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --draft --prerelease="$is_prerelease" --title "Tidy Title & URL $version" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$is_prerelease"

  chrome-web-store:
    needs: verify
    # WXT strips the prerelease suffix from manifest.version, so a prerelease would take the final version's number in the store
    if: ${{ !contains(github.ref_name, '-') }}
    environment: release
    # Two releases submitted at once could overwrite each other's upload between the status check and publish
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CWS_PUBLISHER_ID: b111937e-4d20-4c19-aefb-951207027b54
      CWS_EXTENSION_ID: nfibbddcoilbgjplanohcjgolkapdaej
      WORKLOAD_IDENTITY_PROVIDER: projects/665397681090/locations/global/workloadIdentityPools/github/providers/copy-title-url
      SERVICE_ACCOUNT: cws-publisher@tidy-title-url.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      # This job can mint a token for the store, so skip install scripts; the submit script does not need wxt prepare
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: .output
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Submit to the Chrome Web Store
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/submit-store.ts ".output/copy-title-url-$version-chrome-store.zip" "$version"
